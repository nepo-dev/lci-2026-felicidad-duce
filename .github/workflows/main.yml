name: Build + Deploy
on: workflow_dispatch

env:
  ITCHIO_USERNAME: lcibarcelona
  ITCHIO_GAME: felicidad-duce
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
  GODOT_VERSION: 4.7.2 #if you change it, remember to update the image version (line 17)

jobs:
  web:
    name: Build and deploy to itch.io
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Web Build
        run: |
          mkdir build
          godot --export-release --headless "Web" ./build/index.html
      - name: Itch.io Deploy
        run: |
          butler push ./build $ITCHIO_USERNAME/$ITCHIO_GAME:html5


